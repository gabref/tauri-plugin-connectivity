name: Setup project Rust
description: Install Rust from rust-toolchain.toml and configure the build cache.

inputs:
   components:
      description: Comma-separated Rust components.
      default: ''
   target:
      description: Comma-separated Rust targets.
      default: ''
   cache:
      description: Whether to restore and save the Rust build cache.
      default: 'true'
   cache-workspaces:
      description: Cargo workspace and target directory pairs, one per line.
      default: '. -> target'

runs:
   using: composite
   steps:
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
           components: ${{ inputs.components }}
           target: ${{ inputs.target }}
           cache: ${{ inputs.cache }}
           cache-workspaces: ${{ inputs.cache-workspaces }}
           cache-key: ${{ inputs.target }}
