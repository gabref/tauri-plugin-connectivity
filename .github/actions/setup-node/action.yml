name: Setup project Node.js
description: Select the Node.js version from .nvmrc and cache npm downloads.

inputs:
   cache-dependency-path:
      description: Lockfiles used for the npm cache key.
      default: package-lock.json

runs:
   using: composite
   steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
           node-version-file: .nvmrc
           cache: npm
           cache-dependency-path: ${{ inputs.cache-dependency-path }}
